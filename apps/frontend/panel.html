<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Док-панель</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-panel">
<div class="panel-header">
  <h1>Док-панель</h1>
  <div class="panel-header-right">
    <span class="sse-dot disconnected" id="sseDot"></span>
    <button class="btn-sm" id="btnRefresh" title="Обновить">⟳</button>
  </div>
</div>

<div class="toolbar">
  <button class="btn-next" id="btnNext">▶ Dequeue</button>
  <span class="next-user" id="nextUser"></span>
  <button class="btn-sm" id="btnToggleEnqueue">+ Добавить</button>
  <span class="spacer"></span>
  <button class="btn-sm" id="btnToggleLog">📋 Лог</button>
</div>

<div class="section hidden" id="enqueueSection">
  <div class="inline-form">
    <input type="text" id="enqName" placeholder="Имя зрителя">
    <button class="btn-next" id="btnEnqueue">Добавить</button>
  </div>
</div>

<div class="section">
  <div class="section-title">Активные</div>
  <table><thead><tr><th>Имя</th><th>Статус</th><th>Слот</th><th></th></tr></thead><tbody id="tblActive"><tr><td colspan="4" class="empty-row">Нет записей</td></tr></tbody></table>
</div>

<div class="section">
  <div class="section-title">Завершённые / Отменённые</div>
  <table><thead><tr><th>Имя</th><th>Результат</th><th>Статус</th></tr></thead><tbody id="tblDone"><tr><td colspan="3" class="empty-row">Нет записей</td></tr></tbody></table>
</div>

<div class="section hidden" id="logSection">
  <div class="section-title">События</div>
  <div id="eventLog"><div class="empty-row">Ожидание событий...</div></div>
</div>

<script src="js/panel.js"></script>
</body>
</html>
