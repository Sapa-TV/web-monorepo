name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Base path, e.g. /myapp. Empty for domain root.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: 'true'

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Boundary doctest
        run: cargo test --doc -p domain
      - name: Tests
        run: cargo nextest run --workspace
      - name: Layer graph
        run: node tools/check-layers.mjs

  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: ast-grep rules
        run: pnpm exec ast-grep scan
      - name: ast-grep rule tests
        run: pnpm exec ast-grep test
      - name: Handler length
        run: node tools/check-handler-lines.mjs

  changes:
    needs: [rust, lints]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            backend:
              - 'apps/backend/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deploy/**'
              - '.sops.yaml'
              - '.dockerignore'

  deploy-frontend:
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          VITE_BASE_PATH: ${{ inputs.base_path || vars.FRONTEND_BASE_PATH || '' }}
        run: pnpm --filter frontend build
      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          ssh-key: ${{ secrets.VPS_SSH_KEY }}
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          user: ${{ secrets.VPS_USER }}
      - name: Sync frontend static
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /srv/web-app/www"
          rsync -e "ssh -p $VPS_PORT" -az --delete apps/frontend/build/ "$VPS_USER@$VPS_HOST:/srv/web-app/www/"

  deploy-backend:
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          ssh-key: ${{ secrets.VPS_SSH_KEY }}
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          user: ${{ secrets.VPS_USER }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
      - name: Short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sapa-tv/backend
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Sapa-TV
          permission-packages: read
      - name: Sync app config files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /srv/web-app/app"
          scp -P "$VPS_PORT" deploy/docker-compose.yml "$VPS_USER@$VPS_HOST:/srv/web-app/app/docker-compose.yml"
          scp -P "$VPS_PORT" apps/backend/config.toml "$VPS_USER@$VPS_HOST:/srv/web-app/app/config.toml"
          scp -P "$VPS_PORT" deploy/srs/srs.conf.template "$VPS_USER@$VPS_HOST:/srv/web-app/app/srs.conf.template"
          scp -P "$VPS_PORT" .env.sops "$VPS_USER@$VPS_HOST:/srv/web-app/app/.env.sops"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /srv/web-app/app/deploy/backup"
          scp -P "$VPS_PORT" deploy/backup/backup-db.sh "$VPS_USER@$VPS_HOST:/srv/web-app/app/deploy/backup/backup-db.sh"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "chmod 755 /srv/web-app/app/deploy/backup/backup-db.sh"
      - name: Login to GHCR on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u ${APP_SLUG} --password-stdin" <<< "${APP_TOKEN}"
      - name: Deploy backend (pull, restart, verify, rollback)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s" < deploy/scripts/deploy-backend.sh
