name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Build frontend (static)
    uses: ./.github/workflows/build-frontend.yml
    secrets: inherit

  backend:
    name: Build & push backend image
    uses: ./.github/workflows/build-backend.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  deploy:
    name: Deploy to VPS
    if: github.ref == 'refs/heads/main'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.VPS_SSH_KEY }}
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Sapa-TV
          permission-packages: read
      - name: Add VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
      - name: Sync app config files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /srv/web-app/app"
          scp -P "$VPS_PORT" deploy/docker-compose.yml "$VPS_USER@$VPS_HOST:/srv/web-app/app/docker-compose.yml"
          scp -P "$VPS_PORT" apps/backend/config.toml "$VPS_USER@$VPS_HOST:/srv/web-app/app/config.toml"
          scp -P "$VPS_PORT" deploy/.env.sops "$VPS_USER@$VPS_HOST:/srv/web-app/app/.env.sops"
      - name: Pull image & restart backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u ${APP_SLUG} --password-stdin" <<< "${APP_TOKEN}"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd /srv/web-app/app && sops -d --input-type dotenv --output-type dotenv .env.sops > .env && chmod 600 .env && docker compose pull && docker compose up -d"
      - name: Wait for backend health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
            for i in $(seq 1 30); do
              if curl -fs http://127.0.0.1:3000/health >/dev/null; then
                echo "Backend is healthy"
                exit 0
              fi
              sleep 5
            done
            echo "Backend did not become healthy" >&2
            exit 1
          REMOTE
      - name: Sync frontend static
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -e "ssh -p $VPS_PORT" -az --delete ./frontend/ "$VPS_USER@$VPS_HOST:/srv/web-app/www/"
