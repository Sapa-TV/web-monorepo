cargo-features = ["profile-rustflags"]

[workspace]
resolver = "2"
members = ["apps/backend", "crates/vk-video-live", "tools/gen-openapi"]

[workspace.lints.clippy]
unwrap_used = "deny"
let_underscore_must_use = "warn"
absolute_paths = "deny"
manual_non_exhaustive = "allow"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"

[profile.test]
rustflags = ["-Awarnings"]

[workspace.dependencies]
axum = "0.8.9"
better_tokio_select = "0.2.0"
rand = "0.10.2"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = "0.9.0"
thiserror = "2.0.19"
tokio = "1.53.0"
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "5.5.0", features = ["chrono"] }
utoipa-axum = "0.2.0"
utoipa-redoc = "6.0.0"
utoipa-swagger-ui = "9.0.2"
chrono = { version = "0.4.45", features = ["serde"] }
tokio-stream = "0.1.17"
tower = "0.5.3"
futures-util = "0.3.33"
dotenvy = "0.15.7"
jsonwebtoken = "10.2.0"
base64 = "0.22.1"
subtle = "2.6.1"
config = "0.15.25"
tokio-tungstenite = "0.30.0"
twitch_api = "0.8.0"
reqwest = "0.13.4"
twitch_oauth2 = "0.17.1"
url = "2.5.8"
percent-encoding = "2.3.1"
backend = { version = "0.1.0", path = 'apps/backend' }
uuid = "1.24.1"
strum = "0.28.0"
axum-extra = "0.12.6"
time = "0.3.55"
tokio-util = "0.7.19"
vk-video-live = { path = 'crates/vk-video-live' }
