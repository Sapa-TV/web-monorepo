cargo-features = ["profile-rustflags"]

[workspace]
resolver = "2"
members = ["apps/backend"]

[workspace.lints.clippy]
unwrap_used = "deny"
let_underscore_must_use = "warn"
absolute_paths = "deny"

[profile.test]
rustflags = ["-Awarnings"]

[workspace.dependencies]
axum = "0.8.9"
better_tokio_select = "0.2.0"
rand = "0.10.2"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = "0.9.0"
thiserror = "2.0.19"
tokio = "1.53.0"
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
utoipa-redoc = "6.0.0"
utoipa-swagger-ui = "9.0.2"
chrono = "0.4.45"
tokio-stream = "0.1.17"
tower = "0.5.3"
futures-util = "0.3.33"
dotenvy = "0.15.7"
subtle = "2.6.1"
config = "0.15.25"
tokio-tungstenite = "0.30.0"
twitch_api = "0.8.0"
reqwest = "0.13.4"
twitch_oauth2 = "0.17.1"
url = "2.5.8"
