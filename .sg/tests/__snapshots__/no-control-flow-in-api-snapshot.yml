  ? |-
    async fn create_session(State(state): State<AppState>, headers: HeaderMap, Json(body): Json<CreateSessionRequest>) -> Result<(StatusCode, HeaderMap, Json<SessionResponse>), SessionServiceError> {
        let login_cookie = read_cookie(&headers, LOGIN_COOKIE);
        if login_cookie.as_deref() != Some(body.ticket.as_str()) {
            return Err(SessionServiceError::InvalidTicket);
        }
        let session = state.session_service.issue_session("123", None).await?;
        Ok((StatusCode::CREATED, HeaderMap::new(), Json(SessionResponse { twitch_user_id: session.twitch_user_id, twitch_user_name: session.twitch_user_name, is_root: false, expires_at: session.expires_at.to_rfc3339() })))
    }
