    async fn delete_rarity(State(state): State<AppState>, Path(params): Path<RarityIdParam>) -> Result<StatusCode, ApiError> {
        let deleted = state.rarity_service.delete(params.id).await?;
        if !deleted {
            return Err(ApiError::new(StatusCode::NOT_FOUND, "rarity not found"));
        }
        Ok(StatusCode::NO_CONTENT)
    }
