language: Rust
id: non-exhaustive-api-structs
message: "hand-written `pub` struct in `api` module must be `#[non_exhaustive]`"
severity: error
rule:
  all:
    - any:
        - pattern: "pub struct $NAME;"
        - pattern: "pub struct $NAME($$$FIELDS);"
        - pattern: "pub struct $NAME { $$$FIELDS }"
        - pattern: "pub struct $NAME<$$$TYPE>;"
        - pattern: "pub struct $NAME<$$$TYPE>($$$FIELDS);"
        - pattern: "pub struct $NAME<$$$TYPE> { $$$FIELDS }"
    - regex: "^pub struct"
    - not:
        follows:
          pattern: "#[non_exhaustive]"
          stopBy:
            not:
              any:
                - kind: attribute_item
                - kind: line_comment
                - kind: block_comment
    - not:
        has:
          kind: field_declaration
          stopBy: end
          not:
            has:
              kind: visibility_modifier
files:
  - "crates/api/src/api.rs"
  - "crates/api/src/api/**/*.rs"
  - "crates/api/src/widget_api.rs"
  - "crates/api/src/widget_api/**/*.rs"
ignores:
  - "crates/api/src/**/*.test.rs"