language: Rust
id: max-handler-lines
message: "api handler exceeds 20 lines: extract logic into services/helpers"
severity: error
rule:
  kind: function_item
  follows:
    kind: attribute_item
    regex: utoipa::path
    stopBy: neighbor
files:
  - "crates/api/src/api/**/*.rs"
  - "crates/api/src/widget_api/**/*.rs"
ignores:
  - "crates/api/src/**/*.test.rs"
